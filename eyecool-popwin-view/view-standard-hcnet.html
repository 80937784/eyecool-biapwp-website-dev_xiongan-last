    //查询指定设备的识别记录
    function queryRecogniseRecord(deviceNo) {
        $("#hitresult").html("");
        $("#hitresultinline").html("");
        $("#todayIdentifyNumber").html("");
        $("#todayThermalNumber").html("");
        $.ajax({
            url: location.protocol + '//' + SERVER_IP + ':' + SERVER_PORT + ctx + 'api/show/listresult',
            type: 'GET',
            //contentType : 'application/x-www-form-urlencoded',
            data: {
                "deviceNo": deviceNo,
                "showTmpl": false
            },
            dataType: 'json',
            success: function(resMsg) {
                if (resMsg != null) {
                    var todayIdentifyNumber = resMsg.todayIdentifyNumber;
                    var todayThermalNumber = resMsg.todayThermalNumber;
                    $("#todayIdentifyNumber").html(todayIdentifyNumber);
                    $("#todayThermalNumber").html(todayThermalNumber);
                    $("#hitresult").html('');
                    $("#hitresultinline").html('');
                    for (var i = resMsg.recogLogAlarmList.length - 1; i >= 0; i--) {
                        var personName = resMsg.recogLogAlarmList[i].personName ? resMsg.recogLogAlarmList[i].personName : "";
                        var sceneImage = "data:image/jpeg;base64," + resMsg.recogLogList[i].sceneImage;
                        var faceTemperature = JSON.parse(resMsg.recogLogAlarmList[i].comment).fCurrTemperature.toFixed(1);
                        var createTime = resMsg.recogLogAlarmList[i].createTime;
                        var matchTime = new Date(createTime).Format("HH:mm:ss");
                        if (faceTemperature >= alarmTem) {
                            var html = "<li><img src='" + sceneImage + "' class='user-img'>" +
                                "<img class='userimg-mask' src='" + user_kuang + "'/>" +
                                "<p>" +
                                "<span class='username'>" +
                                (faceTemperature ? faceTemperature : 0) + "℃  " +
                                personName +
                                "</span>" +
                                "<time>" +
                                matchTime +
                                "</time>" +
                                "</p>" +
                                "</li>";
                            $("#hitresult").prepend(html);
                        }
                    }
                    for (var i = resMsg.recogLogList.length - 1; i >= 0; i--) {
                        var personName = resMsg.recogLogList[i].personName ? resMsg.recogLogList[i].personName : "";
                        var faceTemperature = JSON.parse(resMsg.recogLogList[i].comment).fCurrTemperature.toFixed(1);
                        var sceneImage = "data:image/jpeg;base64," + resMsg.recogLogList[i].sceneImage;
                        var createTime = resMsg.recogLogList[i].createTime;
                        var matchTime = new Date(createTime).Format("HH:mm:ss");
                        if (faceTemperature >= alarmTem) {
                            var html_inline =
                                "<li style='background: #f92a02;'>" +
                                "<img style='wid 150px; height: 150px;' src='" + sceneImage + "'>" +
                                "<p>" + (faceTemperature ? faceTemperature : 0) + "℃  " + personName + "</p>" +
                                "</li>";
                        } else {
                            var html_inline =
                                "<li>" +
                                "<img style='wid 150px; height: 150px;' src='" + sceneImage + "'>" +
                                "<p>" + (faceTemperature ? faceTemperature : 0) + "℃  " + personName + "</p>" +
                                "</li>";
                        }
                        $("#hitresultinline").prepend(html_inline);
                    }
                }
            },
            error: function(response) {

            }
        });
    }

    function listDevices() {
        $.ajax({
            url: location.protocol + '//' + SERVER_IP + ':' + SERVER_PORT + ctx + 'api/show/listdevice',
            type: 'GET',
            contentType: 'application/x-www-form-urlencoded',
            dataType: 'json',
            success: function(resMsg) {
                $("#device-list").html("");
                for (var i = 0; i < resMsg.length; i++) {
                    var extInfo = JSON.parse(resMsg[i].extInfo);
                    var deviceNo = resMsg[i].deviceNo;
                    var deviceIp = resMsg[i].deviceIp;
                    var rtspUrl = extInfo.rtspUrl;
                    var rtspUrlExtra = extInfo.rtspUrlExtra;
                    var deviceType = resMsg[i].deviceType;
                    var deviceInfoHtml = "<a href='#' onClick=switchDevice(this,'" +
                        deviceIp +
                        "','" +
                        deviceNo +
                        "','" +
                        rtspUrl +
                        "','" +
                        rtspUrlExtra +
                        "','" +
                        deviceType +
                        "') ><li>" +
                        deviceNo +
                        "</li></a>";
                    $("#device-list").prepend(deviceInfoHtml);
                }
            },
            error: function(response) {

            }
        });
    }

    function switchDevice(obj, deviceIp, serialNo, rtspUrl, rtspUrlExtra, deviceType) {
        $("#activeFont").attr("id", "");
        $(obj).find("li").attr("id", "activeFont");
        var videoW = videoBoxWidth;
        var videoH = videoBoxWidth / 16 * 9;
        // $(".user-box").height(videoH);
        RTSP_URL = rtspUrl;
        if (rtspUrlExtra && deviceType == '3') {
            RTSP_URL_EXTRA = rtspUrlExtra
        } else {
            RTSP_URL_EXTRA = ''
        }
        currentDeviceNo = serialNo;
        setTimeout(createVideoView, 100);
        //根据设备好查询识别记录
        queryRecogniseRecord(serialNo);
    }

    function openSocket() {
        if (stompClient == null) {
            var socket = new SockJS(location.protocol + '//' + SERVER_IP + ':' + SERVER_PORT + ctx + 'websocket?token=kl', null, {
                // 'transports': ['websocket'],
                'timeout': 10000
            });
            constructStomp(socket);
        }
    }

    function constructStomp(socket) {
        stompClient = Stomp.over(socket);
        stompClient.connect({
                token: "kl"
            },
            function(frame) {
                stompClient.subscribe(
                    '/topic/pullhitresult',
                    function(event) {
                        var content = JSON.parse(event.body);
                        var personFlag = content.personFlag;
                        var imageBase64 = content.imageBase64;
                        var matchTime = new Date(content.matchTime).Format("HH:mm:ss");
                        var serialNo = content.serialNo;
                        var personName = content.personName;
                        var personCode = content.personCode;
                        var imageUrl = content.imageUrl;
                        var comment = content.comment;
                        console.log(imageUrl);
                        var finalUrl = encodeURI(imagePreUrl + "?storeFlag=1&url=" + imageUrl);
                        if (serialNo === currentDeviceNo) {
                            var tem = (comment == null ? null : (JSON.parse(comment)['fCurrTemperature'] ? JSON.parse(comment)['fCurrTemperature'].toFixed(1) : null));
                            if (tem >= alarmTem) {
                                var html = "<li><img src='/img/user-kuang.png' class='userimg-mask'>" +
                                    "<img class='user-img' src='data:img/jpeg;base64," + imageBase64 + "' style='wid 132px;height: 132px;'/>" +
                                    "<p>" +
                                    "<span class='faceTemperature'>" +
                                    (tem ? tem : 0) + "℃ " +
                                    " <a class='username'>" + personName +
                                    "</a>" +
                                    "</span>" +
                                    "<time>" +
                                    matchTime +
                                    "</time>" +
                                    "</p>" +
                                    "</li>";
                                $("#hitresult").prepend(html);
                                if ($("#hitresult li").length > 6) {
                                    $("#hitresult li:last").remove()
                                }
                                $("#todayThermalNumber").html(Number($("#todayThermalNumber").html()) + 1);
                                playAudioAlarm();
                            }
                            var html_inline =
                                "<li " + (tem >= alarmTem ? "style='background: #f92a02;'>" : ">") +
                                "<img style='wid 150px; height: 150px;' src='data:img/jpeg;base64," + imageBase64 + "'>" +
                                "<div><p><span>" + (tem ? tem : 0) + "℃ </span><span>" + (personName ? personName : '') + "</span></p></div>" +
                                "</li>";
                            $("#hitresultinline").prepend(html_inline);
                            if ($("#hitresultinline li").length > 5) {
                                $("#hitresultinline li:last").remove()
                            }
                            $("#todayIdentifyNumber").html(Number($("#todayIdentifyNumber").html()) + 1);

                            if (personFlag == 'hit') {
                                var tanchuangHtml = " <div class='model-box'>" +
                                    "<img width='220' height='220' src='data:img/jpeg;base64," + imageBase64 + "' width='256' height='256'>" +
                                    "<p class='username'>" +
                                    personName +
                                    "</p>" +
                                    "<span class='face_temperature'>" +
                                    (tem ? tem : 0) + "℃ " +
                                    "</span>" +
                                    "<date>" +
                                    matchTime +
                                    "</date>" +
                                    "</div>";
                                openModal(tanchuangHtml);
                                if (OPEN_AUDIO) {
                                    playAudio();
                                }
                            }
                        }
                    }, {
                        token: "kltoen"
                    });
                stompClient.subscribe(
                    '/topic/pullstrangerresult',
                    function(event) {
                        var content = JSON.parse(event.body);
                        var serialNo = content.serialNo;
                        var imageBase64 = content.imageBase64;
                        var captureTime = content.matchTime;
                        var comment = content.comment;
                        var tem = (comment == null ? null : (JSON.parse(comment)['fCurrTemperature'] ? JSON.parse(comment)['fCurrTemperature'].toFixed(1) : null));
                        if (serialNo === currentDeviceNo) {
                            if (tem >= alarmTem) {
                                var html = "<li><img src='data:img/jpeg;base64," + imageBase64 + "' class='user-img'>" +
                                    "<img class='userimg-mask' src='/img/user-kuang.png'/>" +
                                    "<p>" +
                                    "<span class='face_temperature'>" +
                                    tem +
                                    "</span>" +
                                    "<time>" +
                                    captureTime +
                                    "</time>" +
                                    "</p></li>";
                                $("#hitresult").prepend(html);
                                if ($("#hitresult li").length > 6) {
                                    $("#hitresult li:last").remove()
                                }
                                $("#todayThermalNumber").html(Number($("#todayThermalNumber").html()) + 1);
                                playAudioAlarm();
                            }
                            var html_inline =
                                "<li " + (tem >= alarmTem ? "style='background: #f92a02;'>" : ">") +
                                "<img style='wid 150px; height: 150px;' src='data:img/jpeg;base64," + imageBase64 + "'>" +
                                "<div><p><span>" + (tem ? tem : 0) + "℃ </span></p></div>" +
                                "</li>";
                            $("#hitresultinline").prepend(html_inline);
                            if ($("#hitresultinline li").length > 5) {
                                $("#hitresultinline li:last").remove()
                            }
                            $("#todayIdentifyNumber").html(Number($("#todayIdentifyNumber").html()) + 1);
                        }
                    }, {
                        token: "kltoen"
                    });
            },
            function(error) {
                var socket = new SockJS(location.protocol + '//' + SERVER_IP + ':' + SERVER_PORT + '/websocket?token=kl', null, {
                    // 'transports': ['websocket'],
                    'timeout': 10000
                });
                // constructStomp(socket);
            });
    }
    var openTTS = false;

        if (openModalSetTimeOut != null) {

        console.log("openModalSetTimeOut is null >  " + (openModalSetTimeOut == null));

            openModalSetTimeOut = setTimeout(function() {
                $("#rectBox ").css("display", "none");
                openModalSetTimeOut = null;
            }, 3000);
        }
    }

    function closeSocket() {
        if (stompClient != null) {
            stompClient.disconnect();
