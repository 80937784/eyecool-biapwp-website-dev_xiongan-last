<script type="text/javascript">
    var modal_box_img = "./static/img/model-box.png";
    var ic_userimg_mask = "./static/img/ic-userimg-mask.png";
    var ic_strangerimg_mask = "./static/img/ic-strangerimg-mask.png";
    var modal_box_img_stranger = "./static/img/model-box-stranger.png";
    var strangerPush = true;
    var hitPush = true;
    var hitShowTmpl = false;
    var stompClient = null;
    var RTSP_URL = "";
    //    缓存当前播放的视频地址，用于控制显示
    var currentDeviceNo = null;
    var videoBoxWidth = 0;
    var updateVideo = function(divName, htmlContent) {
        var imgarea = document.getElementById(divName);
        imgarea.innerHTML = htmlContent;
    };
    var token = null;
    getTitle();

    function getTitle() {
        $.ajax({
            url: './config.json',
            method: "GET",
            success: function(res) {
                console.log(res)
            },
            error: function(response) {}
        });

    function playAudio() {
        var audioDom = document.getElementById("audioHint");
        /**currentTime：当前音频/视频的播放位置（以秒计）
         * duration：当前音频/视频的长度（以秒计)*/
        var currentTime = audioDom.currentTime;
        var duration = audioDom.duration;
        /**如果当前音视频未开始播放，或者播放结束，则让它播放*/
        if (currentTime <= 0 || currentTime == duration) {
            /**播放音视频*/
            audioDom.play();
        }
    }

    function playAudioStranger() {
        var audioDom = document.getElementById("audioStranger");
        /**currentTime：当前音频/视频的播放位置（以秒计）
         * duration：当前音频/视频的长度（以秒计)*/
        var currentTime = audioDom.currentTime;
        var duration = audioDom.duration;
        /**如果当前音视频未开始播放，或者播放结束，则让它播放*/
        if (currentTime <= 0 || currentTime == duration) {
            /**播放音视频*/
            audioDom.play();
        }
    }

    function createVideoView() {
        new QWebChannel(qt.webChannelTransport, function(channel) {
            window.appObj = channel.objects.appObj;
            appObj.updateVideo.connect(updateVideo);
            videoBoxWidth = $("#mask").width() - 1;
            var videoW = videoBoxWidth;
            var videoH = (videoBoxWidth / 16) * 9;
            appObj.setFps(fps);
            appObj.createVideoView("video1", RTSP_URL, videoW, videoH);
        });
    }

    window.onload = function() {
        var showToken = sessionStorage.getItem("showToken");
        token = showToken;
        if (showToken) {
            $("#loginDialog").css("display", "none");
            listDevices();
            openSocket();
        } else {
            $("#loginDialog").css("display", "block");
        }
    };

    function queryRecogniseRecord(deviceNo) {
        $("#hitresult").html("");
        $.ajax({
            url: location.protocol + '//' +
                SERVER_IP +
                ":" +
                SERVER_PORT +
                "/api/show/listresult?token=" +
                urlEncode(token),
            type: "GET",
            contentType: "application/x-www-form-urlencoded",
            data: {
                deviceNo: deviceNo,
                showTmpl: hitShowTmpl
            },
            dataType: "json",
            success: function(resMsg) {
                if (resMsg.code == 500) {
                    sessionStorage.removeItem("showToken");
                    location.reload();
                }
                resMsg = JSON.parse(resMsg.msg);
                if (resMsg != null) {
                    for (var i = resMsg.recogLogList.length - 1; i >= 0; i--) {
                        var personName = resMsg.recogLogList[i].personName ?
                            resMsg.recogLogList[i].personName :(resMsg.recogLogList[i].uniqueId ?resMsg.recogLogList[i].uniqueId :"陌生人");                          
                        var receivedTime = resMsg.recogLogList[i].receivedTime;
                        var matchTime = new Date(receivedTime).Format(
                            "yyyy-MM-dd HH:mm:ss"
                        );
                        var sceneImage;
                        if (hitShowTmpl) {
                            sceneImage =
                                "data:image/jpeg;base64," + resMsg.recogLogList[i].stockImage;
                        } else {
                            sceneImage =
                                "data:image/jpeg;base64," + resMsg.recogLogList[i].sceneImage;
                        }
                        var html =
                            "<li><img src='" + (personName == '陌生人' ? ic_strangerimg_mask : ic_userimg_mask) +
                            "' class='userimg-mask'>" +
                            "<img class='user-img' style='display: block'  src='" +
                            sceneImage +
                            "'/>" +
                            "<p>" +
                            "<span class='username'>" +
                            personName +
                            "</span>" +
                            "<time>" +
                            matchTime +
                            "</time>" +
                            "</p>" +
                            "</li>";
                        $("#hitresult").prepend(html);
                        if ($("#hitresult li").length > 6) {
                            $("#hitresult li:last").remove();
                        }
                    }
                }
            },
            error: function(response) {}
        });
    }

    function listDevices() {
        $.ajax({
            url: location.protocol + '//' +
                SERVER_IP +
                ":" +
                SERVER_PORT +
                "/api/show/listdevice?token=" +
                urlEncode(token),
            type: "GET",
            contentType: "application/x-www-form-urlencoded",
            dataType: "json",
            success: function(resMsg) {
                if (resMsg.code == 500) {
                    sessionStorage.removeItem("showToken");
                    location.reload();
                }
                resMsg = JSON.parse(resMsg.msg);
                $("#device-list").html("");
                for (var i = 0; i < resMsg.length; i++) {
                    var deviceNo = resMsg[i].deviceNo;
                    var deviceIp = resMsg[i].deviceIp;
                    var deviceName = resMsg[i].deviceName;
                    var rtspUrl = JSON.parse(resMsg[i].extInfo).rtspUrl;
                    var deviceInfoHtml =
                        "<a href='#' onClick=switchDevice(this,'" +
                        deviceIp +
                        "','" +
                        deviceNo +
                        "','" +
                        rtspUrl +
                        "') ><li>" +
                        deviceName +
                        "</li></a>";
                    $("#device-list").prepend(deviceInfoHtml);
                }
            },
            error: function(response) {}
        });
    }

    function handleShowLogin() {
        $.ajax({
            url: location.protocol + '//' + SERVER_IP + ":" + SERVER_PORT + "/api/show/login",
            type: "POST",
            contentType: "application/json; charset=UTF-8",
            data: JSON.stringify({
                username: $("#loginName").val(),
                password: $("#password").val()
            }),
            success: function(resMsg) {
                if (resMsg.code == 200) {
                    sessionStorage.setItem("showToken", resMsg.token);
                    location.reload();
                } else {
                    $("#alert").css("display", "block");
                }
            },
            error: function(err) {
                console.log(err);
            }
        });
    }

    function handleShowLogout() {
        sessionStorage.removeItem("showToken");
        location.reload();
    }

    function switchDevice(obj, deviceIp, deviceNo, rtspUrl) {
        $("#activeFont").attr("id", "");
        $(obj)
            .find("li")
            .attr("id", "activeFont");
        var videoW = videoBoxWidth;
        var videoH = (videoBoxWidth / 16) * 9;
        $(".user-box").height(videoH);
        RTSP_URL = rtspUrl;
        currentDeviceNo = deviceNo;
        setTimeout(createVideoView, 100);
        queryRecogniseRecord(deviceNo);
    }

    function constructStomp(socket) {
        stompClient = Stomp.over(socket);
        stompClient.connect({
                token: "kl"
            },
            function(frame) {
                stompClient.subscribe(
                    "/topic/pullhitresult/" + token,
                    function(event) {
                        var content = JSON.parse(event.body);
                        var personFlag = content.personFlag;
                        var imageBase64 = content.imageBase64;
                        var matchTime = content.matchTime;
                        var deviceNo = content.deviceNo;
                        var personName = content.personName;
                        var personCode = content.personCode;
                        var imageUrl = content.imageUrl;
                        if (deviceNo == currentDeviceNo && hitPush) {
                            var html =
                                "<li><img  src='" +
                                ic_userimg_mask +
                                "' class='userimg-mask'>" +
                                "<img class='user-img' src='data:img/jpeg;base64," +
                                imageBase64 +
                                "'/>" +
                                "<p>" +
                                "<span class='username'>" +
                                (personName ? personName : "陌生人") +
                                "</span>" +
                                "<time>" +
                                matchTime +
                                "</time>" +
                                "</p>" +
                                "</li>";
                            $("#hitresult").prepend(html);
                            if ($("#hitresult li").length > 6) {
                                $("#hitresult li:last").remove();
                            }
                            if (personFlag == "hit") {
                                var tanchuangHtml =
                                    " <div class='model-box'>" +
                                    "<img width='220' height='220' src='data:img/jpeg;base64," +
                                    imageBase64 +
                                    "' width='256' height='256'>" +
                                    "<p class='username'>" +
                                    personName +
                                    "</p>" +
                                    "<date>" +
                                    matchTime +
                                    "</date>" +
                                    "</div>";
                                openModal(tanchuangHtml);
                                if (OPEN_AUDIO) {
                                    playAudio();
                                }
                            }
                        }
                    }, {
                        token: "kltoen"
                    }
                );
                stompClient.subscribe(
                    "/topic/pullstrangerresult/" + token,
                    function(event) {
                        var content = JSON.parse(event.body);
                        var deviceNo = content.deviceNo;
                        var imageBase64 = content.imageBase64;
                        var captureTime = content.matchTime;
                        if (deviceNo == currentDeviceNo && strangerPush) {
                            var html =
                                "<li><img src='" +
                                ic_strangerimg_mask +
                                "' class='userimg-mask'>" +
                                "<img class='user-img' src='data:img/jpeg;base64," +
                                imageBase64 +
                                "'/>" +
                                "<p>" +
                                "<span class='username'>" +
                                "陌生人" +
                                "</span>" +
                                "<time>" +
                                captureTime +
                                "</time>" +
                                "</p>" +
                                "</li>";
                            $("#hitresult").prepend(html);
                            if ($("#hitresult li").length > 6) {
                                $("#hitresult li:last").remove();
                            }
                            var tanchuangHtml =
                                " <div class='model-box-stranger'>" +
                                "<img width='220' height='220' src='data:img/jpeg;base64," +
                                imageBase64 +
                                "' width='256' height='256'>" +
                                "<p class='username'>" +
                                "陌生人" +
                                "</p>" +
                                "<date>" +
                                captureTime +
                                "</date>" +
                                "</div>";
                            openStrangerModal(tanchuangHtml);
                            if (OPEN_AUDIO) {
                                playAudioStranger();
                            }
                        }
                    }, {
                        token: "kltoen"
                    }
                );
            },
            function(error) {
                var socket = new SockJS(
                    location.protocol + "//" + SERVER_IP + ":" + SERVER_PORT + "/websocket?token=kl",
                    null, {
                        transports: ["websocket"],
                        timeout: 10000
                    }
                );
                // constructStomp(socket);
            }
        );
    }

    function openSocket() {
        var socket = new SockJS(
            location.protocol + "//" + SERVER_IP + ":" + SERVER_PORT + "/websocket?token=kl",
            null, {
                // 'transports': ['websocket'],
                timeout: 10000
            }
        );
        constructStomp(socket);
    }
    var openModalSetTimeOut = null;
    var openModal = function(html) {
        if (openModalSetTimeOut != null) {
            clearTimeout(openModalSetTimeOut);
            openModalSetTimeOut = null;
        }
        console.log(
            "openModalSetTimeOut is null >  " + (openModalSetTimeOut == null)
        );
        if (html != null && openModalSetTimeOut == null) {
            var rectBox = $("#rectBox");
            $("#rectBox").html("");
            $("#rectBox").prepend(html);
            $(".modal").css("background-image", "url(" + modal_box_img + ")");
            $("#rectBox").css("display", "block");
            openModalSetTimeOut = setTimeout(function() {
                $("#rectBox ").css("display", "none");
                openModalSetTimeOut = null;
            }, 3000);
        }
    };
    var openStrangerModal = function(html) {
        if (openModalSetTimeOut != null) {
            clearTimeout(openModalSetTimeOut);
            openModalSetTimeOut = null;
        }
        console.log(
            "openModalSetTimeOut is null >  " + (openModalSetTimeOut == null)
        );
        if (html != null && openModalSetTimeOut == null) {
            var rectBox = $("#rectBox");
            $("#rectBox").html("");
            $("#rectBox").prepend(html);
            $(".modal").css(
                "background-image",
                "url(" + modal_box_img_stranger + ")"
            );
            $(".modal img").css({
                "margin-top": "60px",
                "margin-left": "15px"
            });
            $("#rectBox").css("display", "block");
            openModalSetTimeOut = setTimeout(function() {
                $("#rectBox ").css("display", "none");
                openModalSetTimeOut = null;
            }, 3000);
        }
    };

    function urlEncode(token) {
        return encodeURIComponent(token)
            .replace(/!/g, "%21")
            .replace(/'/g, "%27")
            .replace(/\(/g, "%28")
            .replace(/\)/g, "%29")
            .replace(/\*/g, "%2A")
            .replace(/%20/g, "+");
    }

    function closeSocket() {
        if (stompClient != null) {
            stompClient.disconnect();
            stompClient = null;
        }
    }

    function time() {
        var today = new Date();
        var hou;
        var time;
        var day;

        this.hour =
            today.getHours() < 10 ? "0" + today.getHours() : today.getHours();
        this.minute =
            today.getMinutes() < 10 ? "0" + today.getMinutes() : today.getMinutes();
        this.second =
            today.getSeconds() < 10 ? "0" + today.getSeconds() : today.getSeconds();

        var d = today.getDay();
        if (d == 0) {
            day = "日";
        } else if (d == 1) {
            day = "一";
        } else if (d == 2) {
            day = "二";
        } else if (d == 3) {
            day = "三";
        } else if (d == 4) {
            day = "四";
        } else if (d == 5) {
            day = "五";
        } else if (d == 6) {
            day = "六";
        }

        $(".date-time").text(
            today.getFullYear() +
            "年" +
            (today.getMonth() + 1) +
            "月" +
            today.getDate() +
            "日" +
            " 星期" +
            day +
            " " +
            this.hour +
            ":" +
            this.minute +
            ":" +
            this.second
        );
    }
    setInterval(time, 1000);
    window.setInterval(listDevices, 10 * 60 * 1000);
</script>
